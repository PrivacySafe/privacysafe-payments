version = 1
SPDX-PackageName = "Secret Agent Club paid access proof of concept"
SPDX-PackageSupplier = "Ivy Cyber LLC <https://ivycyber.com>"
SPDX-PackageDownloadLocation = "https://github.com/PrivacySafe"

[[annotations]]
path = ["**/*.md", "NOTICE", "package.json", "package-lock.json", "public/manifest.webmanifest", ".gitignore", ".env.example", ".github/**", "media/.gitkeep", "media/video.webm", "media/video.mp4", "media/poster.jpg", "screenshot-*.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ivy Cyber LLC"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Ivy Cyber LLC", "Organization for Ethical Source"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["privacysafe_logo.svg", "public/img/*.svg", "public/img/*.png", "public/img/*.ico"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ivy Cyber LLC"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Adapted from a CC BY-SA 4.0 press-kit photograph; ShareAlike keeps the crop under the same license.
[[annotations]]
path = "public/img/john-kiriakou.webp"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ivy Cyber LLC"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["public/img/brands/phantom.svg", "public/img/brands/metamask.svg", "public/img/brands/solflare.svg", "public/img/brands/backpack.svg", "public/img/brands/usdc.svg", "public/img/brands/solana.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024 0xa3k5"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["public/fonts/StackSansText.woff2", "public/fonts/OFL.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 The Stack Sans Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Generated by `npm run build`. Third-party holders and full texts: NOTICE and public/js/THIRD-PARTY-LICENSES.txt.
[[annotations]]
path = "public/js/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Ivy Cyber LLC", "2023 Solana Labs, Inc", "2025 Anza Technology, Inc", "2012 Ryan Day", "2008 Wyatt Baldwin", "2025 Colin McDonnell", "x402 Foundation", "Solana Maintainers"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT AND Apache-2.0"

[[annotations]]
path = ["design/**", "tests/**", "tools/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ivy Cyber LLC"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# PrivacySafe press-kit portrait, CC BY-SA 4.0.
[[annotations]]
path = "design/source-images/john-kiriakou-presskit.png"
precedence = "override"
SPDX-FileCopyrightText = "2026 Ivy Cyber LLC"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Front page assets (Ivy Cyber originals).
[[annotations]]
path = ["public/img/poc/**", "public/downloads/**", "public/js/lightbox.js"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ivy Cyber LLC"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "public/img/poc/kiriakou-rogan.jpg"
precedence = "override"
SPDX-FileCopyrightText = "The Joe Rogan Experience"
SPDX-License-Identifier = "LicenseRef-ThirdPartyStill"

# Walkthroughs: Ivy Cyber recordings with music by Tiny Worlds (CC0) underneath:
# "Happy Adventure (Loop)" (desktop) and "Honey Bear" (device); both in the combined video.
[[annotations]]
path = ["public/videos/*.mp4", "design/walkthrough-videos/*.mp4"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Ivy Cyber LLC", "Tiny Worlds <https://nullrights.com/artist/TinyWorlds>"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND CC0-1.0"

[[annotations]]
path = "design/source-media/tinyworlds-*.mp3"
precedence = "override"
SPDX-FileCopyrightText = "Tiny Worlds <https://nullrights.com/artist/TinyWorlds>"
SPDX-License-Identifier = "CC0-1.0"

# Crawler files, sitemap and social preview.
[[annotations]]
path = ["public/llms.txt", "public/img/social-preview.jpg", "design/social/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ivy Cyber LLC"
SPDX-License-Identifier = "AGPL-3.0-or-later"
